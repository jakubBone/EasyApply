spring.application.name=applikon-backend

# Active profile (dev by default, override with SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server Configuration
server.port=${PORT:8080}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:uploads/cv}

# Actuator - Health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT Configuration
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MINUTES:15}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# Frontend URL (used for OAuth2 redirect)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.mvc.problemdetails.enabled=true

# Jackson - serialize dates as ISO-8601 strings (Instant gets Z suffix)
spring.jackson.serialization.write-dates-as-timestamps=false

# Admin key for service notices management
app.admin-key=${ADMIN_KEY}

# HMAC secret for hashing refresh tokens
app.token.hmac-secret=${APP_TOKEN_HMAC_SECRET}

# Data retention
app.retention.inactive-months=12

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Gemini via Spring AI - dormant return-path provider (ADR-001, superseded by ADR-005).
# Read only when brief.provider=gemini. Key from Google AI Studio; blank is tolerated on
# purpose: a missing/revoked key fails the generation call (brief ends FAILED), never boot.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}

# gemini-2.5-flash (ADR-001) is closed to new projects since mid-2026 - 3.5-flash is its successor
spring.ai.google.genai.chat.options.model=gemini-3.5-flash

# Must stay false: Spring AI 1.1.8's CachedContentServiceCondition calls getBean() during
# configuration parsing, which builds the Gemini Client before placeholder resolution exists -
# the literal string "${spring.ai.google.genai.api-key:}" then reaches Google as the API key.
# The property gate short-circuits first, so the buggy condition never runs. We never use
# cached content anyway (one grounded request per brief).
spring.ai.google.genai.chat.enable-cached-content=false

# Provider retry runs inside Spring AI's client RetryTemplate - never annotation AOP (ADR-004)
spring.ai.retry.max-attempts=2

# --- Brief provider switch (ADR-005) ---
# Adapter switch behind the BriefChatModel port: "groq" (active) or "gemini" (kept as the
# return path). Groq's compound system runs web search server side; Gemini grounding is
# paid-tier-only for new users since 2026. To switch back: brief.provider=gemini and
# spring.ai.model.chat=google-genai (only one chat auto-configuration may be active).
brief.provider=groq
spring.ai.model.chat=openai
# Groq's OpenAI-compatible endpoint; Spring AI appends /v1/chat/completions to base-url
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
# compound-mini = one server-side tool call per request, lowest latency - a brief needs one search
spring.ai.openai.chat.options.model=groq/compound-mini
